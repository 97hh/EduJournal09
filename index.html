<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduJournal</title>
<style>
  :root {
    --blue: #0078d4;
    --blue-hover: #005a9e;
    --bg: #f3f4f6;
    --border: #d1d5db;
    --text: #333;
    --muted: #6b7280;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  /* --- ЭКРАН ЗАГРУЗКИ --- */
  #loader {
    position: fixed; inset: 0; background: #fff; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.4s;
  }
  .desk {
    width: 280px; height: 15px; background: #8b5a2b; border-radius: 10px;
    position: relative; box-shadow: 0 10px 15px rgba(0,0,0,0.1);
  }
  .flowers {
    position: absolute; bottom: 15px; width: 100%;
    display: flex; justify-content: space-between; padding: 0 15px;
  }
  .flower { font-size: 35px; animation: grow 1.5s infinite alternate; transform-origin: bottom; }
  .flower:nth-child(2) { animation-delay: 0.5s; }
  .flower:nth-child(3) { animation-delay: 1s; }
  @keyframes grow { from { transform: scale(0.8) rotate(-5deg); } to { transform: scale(1.1) rotate(5deg); } }
  
  .cat {
    font-size: 60px; position: absolute; bottom: 15px; left: 10%;
    animation: walk 3s infinite ease-in-out alternate;
  }
  @keyframes walk { from { left: 10%; } to { left: 70%; } }

  .loader-text { margin-top: 30px; font-size: 18px; font-weight: bold; color: var(--blue); }

  /* --- ВХОД --- */
  #login {
    position: fixed; inset: 0; background: var(--blue); z-index: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .login-box {
    background: #fff; padding: 30px; border-radius: 8px; width: 100%; max-width: 350px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2); text-align: center;
  }
  .login-box h1 { color: #111; font-size: 22px; margin-bottom: 20px; }
  .login-box input {
    width: 100%; padding: 10px; margin-bottom: 15px;
    border: 1px solid var(--border); border-radius: 4px; font-size: 15px;
  }
  .login-box button {
    width: 100%; padding: 10px; background: var(--blue); color: #fff;
    border: none; border-radius: 4px; font-size: 15px; cursor: pointer; font-weight: bold;
  }
  .login-box button:hover { background: var(--blue-hover); }
  .hint { margin-top: 15px; font-size: 12px; color: var(--muted); }

  /* --- ПРИЛОЖЕНИЕ --- */
  #app { display: none; flex-direction: column; height: 100vh; }
  .header {
    background: var(--blue); color: #fff; height: 50px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  }
  .header-logo { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .header-user { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .avatar { background: #fff; color: var(--blue); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .btn-logout { background: transparent; border: 1px solid #fff; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }

  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 220px; background: #fff; border-right: 1px solid var(--border); padding-top: 10px; }
  .nav-btn {
    padding: 12px 20px; cursor: pointer; font-size: 14px; color: #4b5563;
    border-left: 3px solid transparent; display: flex; align-items: center; gap: 10px;
  }
  .nav-btn.active { background: #e6f2fc; color: var(--blue); font-weight: bold; border-left-color: var(--blue); }
  .nav-btn:hover:not(.active) { background: #f3f4f6; }

  .content { flex: 1; padding: 20px; overflow-y: auto; }
  .page-title { font-size: 22px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  .btn-add { background: var(--blue); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 20px; }

  /* Таблица */
  .table { width: 100%; border-collapse: collapse; }
  .table th, .table td { border: 1px solid var(--border); padding: 10px; text-align: center; font-size: 14px; }
  .table th { background: #f8f9fa; color: var(--muted); font-weight: normal; }
  .table th.date { min-width: 80px; }
  
  .grade { font-weight: bold; font-size: 18px; cursor: pointer; }
  .g5 { color: #10b981; } .g4 { color: #3b82f6; } .g3 { color: #f59e0b; } .g2 { color: #ef4444; }
  .lock { opacity: 0.4; cursor: not-allowed; font-size: 16px; }

  /* Расписание */
  .sched-row { display: flex; border: 1px solid var(--border); border-radius: 4px; padding: 10px; margin-bottom: 10px; background: #f9fafb; }
  .sched-date { font-weight: bold; color: var(--blue); width: 100px; }
  
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>

  <!-- 1. ЗАГРУЗКА -->
  <div id="loader">
    <div class="desk">
      <div class="flowers">
        <div class="flower">🌸</div>
        <div class="flower">🌻</div>
        <div class="flower">🌺</div>
      </div>
      <div class="cat">🐈</div>
    </div>
    <div class="loader-text">Загрузка EduJournal...</div>
  </div>

  <!-- 2. ВХОД -->
  <div id="login">
    <div class="login-box">
      <h1>EduJournal</h1>
      <input type="text" id="user" placeholder="Логин (admin)">
      <input type="password" id="pass" placeholder="Пароль (123)">
      <button onclick="doLogin()">Войти</button>
      <div class="hint">
        Учитель: admin / 123<br>
        Ученик: student / 123
      </div>
    </div>
  </div>

  <!-- 3. ПРИЛОЖЕНИЕ -->
  <div id="app">
    <div class="header">
      <div class="header-logo">
        <span style="background:#fff; color:var(--blue); padding:2px 6px; border-radius:4px;">EduJournal</span>
      </div>
      <div class="header-user">
        <span id="userName">Имя</span>
        <div class="avatar" id="userAvatar">И</div>
        <button class="btn-logout" onclick="logout()">Выйти</button>
      </div>
    </div>

    <div class="main">
      <div class="sidebar">
        <div class="nav-btn active" onclick="showTab('journal', this)">📓 Журнал</div>
        <div class="nav-btn" onclick="showTab('schedule', this)">📅 Расписание</div>
      </div>

      <div class="content">
        <!-- ЖУРНАЛ -->
        <div id="tab-journal" class="view active">
          <div class="page-title">
            <span>Журнал оценок</span>
            <div id="adminBlock" style="display:none;">
              <button class="btn-add" onclick="addLesson()">+ Добавить урок</button>
            </div>
          </div>
          <div class="card">
            <table class="table" id="table">
              <!-- Таблица генерируется скриптом -->
            </table>
          </div>
        </div>

        <!-- РАСПИСАНИЕ -->
        <div id="tab-schedule" class="view">
          <div class="page-title">Расписание</div>
          <div class="card" id="scheduleList">
            <!-- Список генерируется скриптом -->
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Инициализация базы данных с защитой от ошибок
  let db;
  try {
    db = JSON.parse(localStorage.getItem('ej_db'));
  } catch(e) {
    db = null;
  }

  if (!db) {
    db = {
      users: [
        { login: 'admin', pass: '123', role: 'teacher', name: 'Учитель' },
        { login: 'student', pass: '123', role: 'student', name: 'Ученик' }
      ],
      lessons: [
        { id: 1, date: '02.11.2026', subject: 'Алгебра' },
        { id: 2, date: '03.11.2026', subject: 'Физика' },
        { id: 3, date: '10.11.2026', subject: 'История' } // Будущая дата
      ],
      grades: {
        1: { 'student': 5 },
        2: { 'student': 4 }
      }
    };
    saveDB();
  }

  function saveDB() {
    localStorage.setItem('ej_db', JSON.stringify(db));
  }

  let currentUser = null;

  // Скрытие загрузки
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);
      }
    }, 1500);
  });

  // Вход
  function doLogin() {
    const l = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value.trim();
    const user = db.users.find(u => u.login === l && u.pass === p);

    if (user) {
      currentUser = user;
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userAvatar').textContent = user.name[0];
      
      // Показываем кнопку добавления урока только учителю
      if (user.role === 'teacher') {
        document.getElementById('adminBlock').style.display = 'block';
      }

      renderTable();
      renderSchedule();
    } else {
      alert('Неверный логин или пароль!');
    }
  }

  function logout() {
    location.reload();
  }

  // Переключение вкладок
  function showTab(tabId, btn) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  // Отрисовка журнала
  function renderTable() {
    const table = document.getElementById('table');
    table.innerHTML = '';

    // Заголовок
    let thead = '<tr><th>Предмет</th>';
    db.lessons.forEach(lesson => {
      thead += `<th class="date">${lesson.date}<br><small>${lesson.subject}</small></th>`;
    });
    thead += '</tr>';
    table.innerHTML = thead;

    // Строка ученика
    let row = '<tr><td style="text-align:left; font-weight:bold; background:#f8f9fa;">Иванов Иван</td>';

    // Получаем сегодняшнюю дату без времени
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    db.lessons.forEach(lesson => {
      // Безопасный парсинг даты (ДД.ММ.ГГГГ)
      const parts = lesson.date.split('.');
      let isFuture = false;
      
      if (parts.length === 3) {
        const lessonDate = new Date(parts[2], parts[1] - 1, parts[0]);
        if (lessonDate > today) isFuture = true;
      }

      const grade = db.grades[lesson.id] ? db.grades[lesson.id]['student'] : null;

      if (isFuture) {
        // Замок для будущих дат
        row += `<td><span class="lock">🔒</span></td>`;
      } else {
        if (grade) {
          // Оценка
          row += `<td><span class="grade g${grade}">${grade}</span></td>`;
        } else {
          // Нет оценки
          if (currentUser.role === 'teacher') {
            row += `<td style="color:#ccc; cursor:pointer;" onclick="setGrade(${lesson.id})">+</td>`;
          } else {
            row += `<td>-</td>`;
          }
        }
      }
    });

    row += '</tr>';
    table.innerHTML += row;
  }

  // Учитель ставит оценку
  function setGrade(lessonId) {
    if (currentUser.role !== 'teacher') return;
    const g = prompt('Оценка (2, 3, 4, 5):');
    if (g === '2' || g === '3' || g === '4' || g === '5') {
      if (!db.grades[lessonId]) db.grades[lessonId] = {};
      db.grades[lessonId]['student'] = parseInt(g);
      saveDB();
      renderTable();
    }
  }

  // Учитель добавляет урок
  function addLesson() {
    if (currentUser.role !== 'teacher') return;
    const subj = prompt('Название предмета:');
    const date = prompt('Дата (ДД.ММ.ГГГГ, например 15.11.2026):');
    
    if (subj && date && date.split('.').length === 3) {
      db.lessons.push({ id: Date.now(), date: date, subject: subj });
      saveDB();
      renderTable();
      renderSchedule();
    } else {
      alert('Неверный формат даты!');
    }
  }

  // Отрисовка расписания
  function renderSchedule() {
    const list = document.getElementById('scheduleList');
    list.innerHTML = '';

    if (db.lessons.length === 0) {
      list.innerHTML = '<p style="color:#999;">Уроков пока нет.</p>';
      return;
    }

    db.lessons.forEach(l => {
      list.innerHTML += `
        <div class="sched-row">
          <div class="sched-date">${l.date}</div>
          <div style="font-weight:bold;">${l.subject}</div>
        </div>
      `;
    });
  }
</script>
</body>
</html>
